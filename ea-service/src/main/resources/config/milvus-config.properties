# ===== Milvus 连接配置（provider=milvus 时生效）=====
# 注意：向量库开关 easy-agent.vectorstore.provider 定义在 application.yml，不放在本文件
easy-agent.vectorstore.milvus.host=124.221.225.161
easy-agent.vectorstore.milvus.port=19530
# 认证（Milvus 未开启鉴权可留空）
easy-agent.vectorstore.milvus.username=
easy-agent.vectorstore.milvus.password=
easy-agent.vectorstore.milvus.database-name=default
# 是否使用 TLS
easy-agent.vectorstore.milvus.secure=false

# ===== Milvus 集合/索引配置 =====
# 需与 EmbeddingModel 输出维度一致（当前 qwen2.5:3b 为 2048，与 ES 保持一致）
easy-agent.vectorstore.milvus.embedding-dimension=2048
# 自动创建集合与索引
easy-agent.vectorstore.milvus.initialize-schema=true
# 距离度量：COSINE / L2 / IP
easy-agent.vectorstore.milvus.metric-type=COSINE
# 索引类型：IVF_FLAT / HNSW / FLAT 等
easy-agent.vectorstore.milvus.index-type=IVF_FLAT

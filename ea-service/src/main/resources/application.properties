spring.application.name=spring-ai

# application-redis-config.properties
#spring.profiles.include=redis-config

spring.config.import=optional:classpath:/config/redis-config.properties,optional:classpath:/config/mysql-config.yml,optional:classpath:/config/elasticSearch-config.properties,optional:classpath:/config/milvus-config.properties,classpath:/config/image-detect-config.yml,optional:file:./.env[.properties]


# 手写业务 SQL 的 Mapper XML 目录。
# 注意只注册 mapper/，不注册 mbg/mapper/：后者是代码生成器产物，
# 单条 CRUD 由 tk.mybatis 内置方法提供，一直未被加载，加载反而会与内置语句冲突。
mybatis.mapper-locations=classpath*:/mapper/*.xml

logging.config=classpath:log4j2-spring.xml
logging.file.path=./log
logging.file.name=easy-name


#logging.level.org.springframework.boot.autoconfigure=DEBUG

# JWT 配置
jwt.secret=your-secret-key-change-in-production-please-use-strong-random-string
# 7天，单位毫秒
jwt.expiration=604800000
jwt.cookie-name=AUTH_TOKEN
# 7天，单位秒
jwt.cookie-max-age=604800
# Cookie domain，本地开发设置为 localhost
jwt.cookie-domain=localhost

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.redis.RedisVectorStoreAutoConfiguration
      - org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration
      # Milvus 向量库不使用官方自动配置，改由 MilvusVectorStoreConfig + VectorStoreRegister 按集合动态创建，避免启动时强制连接 Milvus
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration
      # ES 向量库同样由 ElasticsearchVectorStoreAutoConfiguration(本项目自定义, 按 provider 开关) 唯一提供，排除官方自动配置避免 milvus 模式下仍连接 ES
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration

# 向量数据库提供方开关：es 或 milvus（后端统一由 VectorStoreRegister 按此值选择）
# embedding 提供方开关：ollama（本地 qwen2.5:3b）或 openai（百炼 text-embedding-v4，走 OpenAI 兼容接口）
easy-agent:
  vectorstore:
    provider: milvus
  embedding:
    provider: openai
  # 图片搜索（以图搜图）：百炼 qwen3-vl-embedding 原生多模态接口 + 独立 Milvus 集合
  image-search:
    api-key: ${DASHSCOPE_API_KEY:sk-placeholder-set-in-dotenv}
    model: qwen3-vl-embedding
    dimension: 1024
    collection-name: ea_image_search
    storage: local
    upload-dir: ./uploads/image-search
---


spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:3b  # 经过测试： qwen2.5:0.5b 因为体积小不够智能
          temperature: 0.7
      embedding:
        model: qwen2.5:3b # 默认模型是：org.springframework.ai.ollama.api.OllamaModel#MXBAI_EMBED_LARGE
---
spring:
  ai:
    openai: #感谢： https://github.com/chatanywhere/GPT_API_free?tab=readme-ov-file
      api-key: your_api_key # 获取免费apiKey https://mp.weixin.qq.com/s?__biz=MzU0MzI3MzU1Ng==&mid=2247484719&idx=1&sn=33b4f623d421216fae26ddcae446e4da&chksm=fb0ca214cc7b2b0215d12a29ff091c5840798b8b15657212d248f73ae6b7c63b2fc28e72bf4a&scene=21#wechat_redirect
      base-url:  https://api.chatanywhere.tech #  https://api.openai.com（分为代理地址和直连地址）
      chat:
        options:   # 默认model是gpt-4o：org.springframework.ai.autoconfigure.openai.OpenAiChatProperties.DEFAULT_CHAT_MODEL
          model: gpt-4o #免费版支持gpt-4，一天3次；支持gpt-4o-mini，和gpt-3.5-turbo共享一天200次。
      image:
        enabled: true # 默认是开启的
        base-url:   https://api.chatanywhere.tech #可选地覆盖 spring.ai.openai.base-url 以提供特定于聊天的 url
        api-key: your_api_key #可选地覆盖 spring.ai.openai.api-key 以提供特定于聊天的 api-key
      # 通用 embedding：走阿里云百炼 OpenAI 兼容接口（text-embedding-v4），独立于上面的 chat 配置
      embedding:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1 # 覆盖 chat 的 base-url，仅 embedding 生效
        api-key: ${DASHSCOPE_API_KEY} # 从项目根 .env 读取，勿把真实 key 写进本文件
        options:
          model: text-embedding-v4
          dimensions: 2048 # 必须与 Milvus/ES 配置的维度一致
---
spring:
  ai:
    deepseek: #感谢：硅基流动 https://cloud.siliconflow.cn/models
      api-key: your_api_key
      base-url: https://api.siliconflow.cn/
      chat:
        options:
          model: Qwen/QwQ-32B
        completions-path: /v1/chat/completions

---
spring:
  ai:
    dp: #感谢：硅基流动 https://cloud.siliconflow.cn/models
      api-key: your_api_key
      base-url: https://api.siliconflow.cn/
      chat:
        options:
          model: Qwen/QwQ-32B
        completions-path: /v1/chat/completions
